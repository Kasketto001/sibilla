<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Sibilla's sphere, still: the same colours as the animated one in the app. -->
  <defs>
    <clipPath id="c"><circle cx="32" cy="32" r="30"/></clipPath>
    <filter id="b" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7"/></filter>
    <radialGradient id="h" cx="32%" cy="26%" r="30%"><stop offset="0" stop-color="#fff" stop-opacity=".6"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <radialGradient id="r" cx="50%" cy="50%" r="50%"><stop offset=".72" stop-color="#2a1c0c" stop-opacity="0"/><stop offset="1" stop-color="#2a1c0c" stop-opacity=".6"/></radialGradient>
  </defs>
  <g clip-path="url(#c)">
    <rect width="64" height="64" fill="#2a1c0c"/>
    <g filter="url(#b)">
      <circle cx="40" cy="18" r="20" fill="#f5c400"/>
      <circle cx="46" cy="40" r="14" fill="#d98a1c"/>
      <circle cx="18" cy="34" r="13" fill="#f3e6b8"/>
      <circle cx="42" cy="54" r="9" fill="#4fb3c4"/>
    </g>
    <circle cx="32" cy="32" r="30" fill="url(#h)"/>
    <circle cx="32" cy="32" r="30" fill="url(#r)"/>
  </g>
</svg>
